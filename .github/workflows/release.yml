name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Require tag to match project version
        shell: pwsh
        run: |
          [xml] $project = Get-Content -LiteralPath "src/OtpHarbor.IconPackBuilder/OtpHarbor.IconPackBuilder.csproj"
          $projectVersion = [string] $project.Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }
      - name: Restore
        run: dotnet restore OtpHarbor.IconPackBuilder.sln
      - name: Build
        run: dotnet build OtpHarbor.IconPackBuilder.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test OtpHarbor.IconPackBuilder.sln --configuration Release --no-build

  publish:
    name: Publish and verify (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            family: windows
          - name: Windows ARM64
            os: windows-11-arm
            rid: win-arm64
            family: windows
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            family: linux
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64
            family: linux
          - name: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            family: macos
          - name: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
            family: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "publish/${{ matrix.rid }}"
          dotnet publish "src/OtpHarbor.IconPackBuilder/OtpHarbor.IconPackBuilder.csproj" `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $publishDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise published executable with a production pack build
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "publish/${{ matrix.rid }}"
          $executableName = if ("${{ matrix.family }}" -eq "windows") {
            "OtpHarbor.IconPackBuilder.exe"
          } else {
            "OtpHarbor.IconPackBuilder"
          }
          $executable = Join-Path $publishDirectory $executableName
          if ("${{ matrix.family }}" -ne "windows") { chmod +x $executable }
          $pack = Join-Path $env:RUNNER_TEMP "otp-harbor-icons.otphicons"
          & $executable build --output $pack --non-interactive --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $visualReport = [System.IO.Path]::ChangeExtension($pack, ".visual-report.json")
          $rightsReport = [System.IO.Path]::ChangeExtension($pack, ".rights-report.json")
          foreach ($requiredFile in @($pack, $visualReport, $rightsReport)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "The published executable did not create '$requiredFile'."
            }
          }
      - name: Package release artifact
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "publish/${{ matrix.rid }}"
          $distributionDirectory = Join-Path $env:RUNNER_TEMP "distribution"
          New-Item -ItemType Directory -Path $distributionDirectory -Force | Out-Null
          if ("${{ matrix.family }}" -eq "windows") {
            Copy-Item -LiteralPath (Join-Path $publishDirectory "OtpHarbor.IconPackBuilder.exe") `
              -Destination (Join-Path $distributionDirectory "OtpHarbor.IconPackBuilder-${{ matrix.rid }}.exe")
          } else {
            $packageName = "OtpHarbor.IconPackBuilder-${{ matrix.rid }}"
            $packageRoot = Join-Path $env:RUNNER_TEMP $packageName
            New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $publishDirectory "OtpHarbor.IconPackBuilder") `
              -Destination (Join-Path $packageRoot "OtpHarbor.IconPackBuilder")
            if ("${{ matrix.family }}" -eq "macos") {
              $launcher = Join-Path $packageRoot "Run OTP Harbor Icon Pack Builder.command"
              Copy-Item -LiteralPath "packaging/Run OTP Harbor Icon Pack Builder.command" -Destination $launcher
            } else {
              $launcher = Join-Path $packageRoot "run-otp-harbor-icon-pack-builder.sh"
              Copy-Item -LiteralPath "packaging/run-otp-harbor-icon-pack-builder.sh" -Destination $launcher
            }
            Copy-Item -LiteralPath "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md" -Destination $packageRoot
            chmod +x (Join-Path $packageRoot "OtpHarbor.IconPackBuilder")
            chmod +x $launcher
            & $launcher --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -czf (Join-Path $distributionDirectory "$packageName.tar.gz") `
              -C $env:RUNNER_TEMP $packageName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Download verified artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add documentation and checksums
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md" -Destination "release-assets"
          $checksumLines = Get-ChildItem -LiteralPath "release-assets" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path "release-assets") "SHA256SUMS.txt"),
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false))
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --verify-tag
          --title "OTP Harbor Icon Pack Builder ${GITHUB_REF_NAME}"
          --generate-notes
